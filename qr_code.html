<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RA - Marcadores Play/Pause</title>
    
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

    <script>
        AFRAME.registerComponent('controlador-click', {
            init: function () {
                let reproduciendo = false;
                let iniciado = false; 
                
                window.addEventListener('click', () => {
                    let sonido = document.querySelector('#audio-fx');
                    let interactivos = document.querySelectorAll('.interactivo');
                    
                    if (!reproduciendo) {

                        sonido.play();
                        
                        interactivos.forEach(el => {
                            if (!iniciado) {
                                el.emit('arrancar'); 
                            } else {
                                el.emit('reanudar'); 
                            }
                        });
                        
                        reproduciendo = true;
                        iniciado = true;
                    } else {
                        sonido.pause();
                        
                        interactivos.forEach(el => {
                            el.emit('pausar');
                        });
                        
                        reproduciendo = false;
                    }
                });
            }
        });
    </script>
</head>
<body style="margin: 0; overflow: hidden;">
    
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" controlador-click>
        
        <a-assets>
            <a-asset-item id="heli" src="helicoptero.glb"></a-asset-item>
            <audio id="audio-fx" src="sonido.mp3" preload="auto"></audio>
        </a-assets>

        <a-marker preset="hiro">
            <a-entity
                class="interactivo"
                animation__pos="property: position; from: -1 0.5 0; to: 1 0.5 0; dir: alternate; loop: true; dur: 2000; startEvents: arrancar; pauseEvents: pausar; resumeEvents: reanudar"
                animation__rot="property: rotation; from: 0 0 0; to: 0 360 0; loop: true; dur: 2000; easing: linear; startEvents: arrancar; pauseEvents: pausar; resumeEvents: reanudar"
                animation__sca="property: scale; from: 1 1 1; to: 2 2 2; dir: alternate; loop: true; dur: 1500; startEvents: arrancar; pauseEvents: pausar; resumeEvents: reanudar">
                
                <a-entity gltf-model="#heli" scale="0.05 0.05 0.05"></a-entity>
            </a-entity>
        </a-marker>

        <a-marker preset="kanji">
            <a-sphere 
                class="interactivo"
                position="0 0.5 0" 
                radius="0.5" 
                material="transparent: true; opacity: 0.5; color: #ff0000"
                animation__color="property: material.color; type: color; from: #ff0000; to: #0000ff; dir: alternate; loop: true; dur: 1000; startEvents: arrancar; pauseEvents: pausar; resumeEvents: reanudar"
                animation__opacity="property: material.opacity; from: 0.2; to: 1.0; dir: alternate; loop: true; dur: 1000; startEvents: arrancar; pauseEvents: pausar; resumeEvents: reanudar">
            </a-sphere>
        </a-marker>
        
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
